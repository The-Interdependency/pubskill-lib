[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pubskill-lib"
version = "0.2.1"
description = "Public inspect CLI for evidence-led repository findings"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"

[project.scripts]
pubskill-inspect = "pubskill_lib.audit:main"
pubskill-examine = "pubskill_lib.examine:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pubskill_lib = ["_source.json"]
