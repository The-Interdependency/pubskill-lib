# One-use execution helper. The materialized commit removes this workflow;
# normal read-only PR workflows validate that final commit separately.
name: materialize-skill-source
on:
  push:
    branches: [maintenance/skill-source-9867ab3]
    paths: [.github/workflows/materialize-skill-source.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'The-Interdependency/pubskill-lib' && github.ref == 'refs/heads/maintenance/skill-source-9867ab3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: consumer
          persist-credentials: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: The-Interdependency/skill-lib
          ref: 9867ab33877f2b1f50f8a501cf379aa99360bd52
          fetch-depth: 0
          path: canonical
          persist-credentials: false
      - name: Materialize only the canonical public slice
        run: |
          test "$(git -C canonical rev-parse HEAD)" = 9867ab33877f2b1f50f8a501cf379aa99360bd52
          test -z "$(git -C canonical status --porcelain)"
          python canonical/tools/propagate_skills.py consumer --skills msdmd repo-audit-repair
          python canonical/tools/propagate_skills.py consumer --skills msdmd repo-audit-repair --apply
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil, subprocess
          root = Path('consumer')
          pin = '9867ab33877f2b1f50f8a501cf379aa99360bd52'
          source_date = subprocess.check_output(['git', '-C', 'canonical', 'show', '-s', '--format=%cs', pin], text=True).strip()
          path = root / 'SOURCE.md'
          text, count = re.subn(r'(?m)^\| Pinned SHA \| `[^`]+` \|$', f'| Pinned SHA | `{pin}` |', path.read_text())
          assert count == 1
          text, count = re.subn(r'(?m)^\| Pinned date \| [^|]+ \|$', f'| Pinned date | {source_date} |', text)
          assert count == 1
          path.write_text(text)
          path = root / 'src/pubskill_lib/_source.json'
          source = json.loads(path.read_text())
          source['commit'] = pin
          path.write_text(json.dumps(source, indent=2) + '\n')
          shutil.copyfile('canonical/msdmd/parsers/universal.py', root / 'src/pubskill_lib/_msdmd_universal.py')
          graph = {
              'schema': 'the-interdependency.stack-manifest', 'version': '1.0.0',
              'repositories': [
                  {'repository': 'The-Interdependency/skill-lib', 'commit': pin,
                   'authority': 'Canonical public skill text, MSDMD implementation and reader contracts',
                   'relation': 'Producer of the exact msdmd and repo-audit-repair public slice'},
                  {'repository': 'The-Interdependency/pubskill-lib', 'commit': '06d8efa1c4200a08e60ea61cec088ef18236b631',
                   'authority': 'Public distribution, CLI, packaging, fixtures and hosted integration',
                   'relation': 'Pre-update consumer source; this transaction refreshes its canonical public slice'}],
              'boundaries': {'authority_transfer': False, 'proof_status_transfer': False,
                  'measurement_status_transfer': False, 'semantic_mapping': 'external-provenance',
                  'agent_scope': 'cross-repository-work-graph',
                  'hmmm': ['Source propagation does not establish release or live deployment. The hosted MSDMD service and MCP adapter remain separate work; no certification or empirical validity transfers.']}}
          payload = {key: graph[key] for key in ('repositories', 'boundaries')}
          graph['work_graph_sha256'] = hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          path = root / 'docs/work-graphs/skill-source-sync.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(graph, indent=2) + '\n')
          path = root / 'README.md'
          text = path.read_text()
          anchor = '## Canon\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '\nPropagation and verification: [Updating the canonical public slice](docs/skill-source-sync.md).\n', 1)
          path.write_text(text)
          PY
          git -C consumer rm .github/workflows/materialize-skill-source.yml
          git -C consumer add -- .agents/skills SOURCE.md README.md src/pubskill_lib/_source.json src/pubskill_lib/_msdmd_universal.py docs/work-graphs/skill-source-sync.json
          git -C consumer diff --cached --stat
          git -C consumer config user.name 'github-actions[bot]'
          git -C consumer config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C consumer commit -m 'chore: propagate canonical public skills from skill-lib 9867ab33877f'
          git -C consumer push origin HEAD:refs/heads/maintenance/skill-source-9867ab3
          echo "Materialized head: $(git -C consumer rev-parse HEAD)"
