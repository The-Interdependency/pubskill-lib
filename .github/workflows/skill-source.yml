name: canonical-source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  canonical-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: consumer
          persist-credentials: false
      # Trust is anchored here, not selected by PR-controlled package metadata.
      # A source refresh must update this pin and the publication records together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: The-Interdependency/skill-lib
          ref: 3001c1a70c1c9d5a063325193ed4ee6db73cd765
          path: canonical
          persist-credentials: false
      - name: Verify publication identity and complete public slice
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          source = json.loads(Path('consumer/src/pubskill_lib/_source.json').read_text())
          assert source['repository'] == 'The-Interdependency/skill-lib'
          assert source['schema'] == 'pubskill-lib.source' and source['version'] == 1
          actual = subprocess.check_output(['git', '-C', 'canonical', 'rev-parse', 'HEAD'], text=True).strip()
          assert source['commit'] == actual, 'publication metadata differs from trusted producer checkout'
          PY
          diff -ru canonical/msdmd consumer/.agents/skills/msdmd
          diff -ru canonical/repo-audit-repair consumer/.agents/skills/repo-audit-repair
          diff -ru canonical/manifest consumer/.agents/skills/manifest
          diff -ru canonical/llms-build consumer/.agents/skills/llms-build
          diff -ru canonical/doc-build consumer/.agents/skills/doc-build
          diff -ru canonical/cap-build consumer/.agents/skills/cap-build
          diff -ru canonical/deps-build consumer/.agents/skills/deps-build
          diff -ru canonical/test-build consumer/.agents/skills/test-build
          diff -ru canonical/github-tests consumer/.agents/skills/github-tests
          diff -ru canonical/ssh-automation consumer/.agents/skills/ssh-automation
          diff -ru canonical/sql-queries consumer/.agents/skills/sql-queries
          diff -ru canonical/statistical-analysis consumer/.agents/skills/statistical-analysis
          diff -ru canonical/explore-data consumer/.agents/skills/explore-data
          diff -ru canonical/validate-data consumer/.agents/skills/validate-data
          cmp canonical/doctrine/msdmd-checks.md consumer/.agents/skills/doctrine/msdmd-checks.md
          cmp canonical/ATTRIBUTION.md consumer/ATTRIBUTION.md
          cmp canonical/LICENSES/Apache-2.0.txt consumer/LICENSES/Apache-2.0.txt
          cmp canonical/msdmd/parsers/universal.py consumer/src/pubskill_lib/_msdmd_universal.py
          cmp canonical/llms/__init__.py consumer/llms/__init__.py
          cmp canonical/llms/build.py consumer/llms/build.py
          git -C consumer diff --exit-code
      # Declared derived copies are not byte-identical by design. Bind them to the
      # trusted producer bytes and the reviewed consumer bytes instead.
      - name: Verify declared derived copies
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          record = json.loads(Path('consumer/docs/derived-copies.json').read_text())
          assert record['schema'] == 'pubskill-lib.derived-copies' and record['version'] == 1
          assert record['source_repository'] == 'The-Interdependency/skill-lib'
          actual = subprocess.check_output(['git', '-C', 'canonical', 'rev-parse', 'HEAD'], text=True).strip()
          assert record['source_commit'] == actual, 'derived-copy record differs from trusted producer checkout'
          for copy in record['copies']:
              consumers = set()
              for item in copy['files']:
                  source = Path('canonical') / item['source']
                  consumer = Path('consumer') / item['consumer']
                  assert sha(source) == item['source_sha256'], f"producer drift: {item['source']}"
                  assert sha(consumer) == item['consumer_sha256'], f"unrecorded consumer edit: {item['consumer']}"
                  if item['relation'] == 'exact':
                      assert source.read_bytes() == consumer.read_bytes(), item['consumer']
                  else:
                      assert item['relation'] == 'redacted', item['relation']
                  consumers.add(item['consumer'])
              skill_dir = Path('consumer/.agents/skills') / copy['name']
              present = {str(path.relative_to('consumer')) for path in skill_dir.rglob('*') if path.is_file() and '__pycache__' not in path.parts}
              assert present == consumers, f"unrecorded files in {copy['name']}: {sorted(present ^ consumers)}"
          PY
